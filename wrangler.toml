name = "mediahub-website"
main = ".open-next/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets" }
[[d1_databases]]
binding = "DB"
database_name = "inventory-tracker-db"
database_id = "inventory-tracker-db-id"
migrations_dir = "migrations"

[vars]
# Public/non-secret env vars go here.
# Secret vars (AUTH_SECRET, GOOGLE_CLIENT_SECRET, etc.) go in:
#   - .dev.vars for local wrangler dev
#   - `wrangler secret put <KEY>` for production

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
